[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-model-frontier"
version = "0.1.0"
description = "Reproducible experiments for capability per memory and compute in small language models"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
memory = ["psutil>=5.9"]

[project.scripts]
frontier = "frontier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
